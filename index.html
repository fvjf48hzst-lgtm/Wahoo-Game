<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RUN!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b10;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*
      The game itself is always 16:9.
      The browser scales it up/down to fit the screen.
    */

    #gameWrapper {
      position: relative;

      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);

      aspect-ratio: 16 / 9;

      overflow: hidden;
      background: #75c9ff;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;
    }

    /* =========================
       SCORE
    ========================= */

    #ui {
      position: absolute;

      top: 24px;
      left: 30px;

      color: white;

      font-size: 28px;
      font-weight: 800;

      letter-spacing: 1px;

      text-shadow:
        3px 3px 0 rgba(0, 0, 0, 0.35);

      pointer-events: none;
    }

    /* =========================
       GAME OVER
    ========================= */

    #gameOver {
      position: absolute;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;
      flex-direction: column;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      text-align: center;
    }

    #gameOver h1 {
      font-size: clamp(50px, 8vw, 110px);

      margin-bottom: 12px;

      letter-spacing: 4px;

      text-shadow:
        5px 5px 0 rgba(0, 0, 0, 0.35);
    }

    #gameOver p {
      font-size: 26px;

      margin-bottom: 30px;
    }

    #restartButton {
      padding: 16px 34px;

      border: none;
      border-radius: 12px;

      background: white;
      color: #111;

      font-size: 20px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    #restartButton:hover {
      transform: scale(1.06);

      box-shadow:
        0 8px 30px rgba(255, 255, 255, 0.25);
    }

    #restartButton:active {
      transform: scale(0.97);
    }

    /* =========================
       MOBILE JUMP BUTTON
    ========================= */

    #mobileJump {
      position: absolute;

      right: 25px;
      bottom: 25px;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      border: 3px solid white;

      background: rgba(0, 0, 0, 0.35);

      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      z-index: 10;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;
    }

    #mobileJump:active {
      transform: scale(0.94);
      background: rgba(0, 0, 0, 0.55);
    }

    /* Hide mobile button on computers */

    @media (hover: hover) and (pointer: fine) {
      #mobileJump {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="gameWrapper">

    <canvas id="game"></canvas>

    <div id="ui">
      SCORE: <span id="score">0</span>
    </div>

    <div id="gameOver">

      <h1>GAME OVER</h1>

      <p>
        Score:
        <span id="finalScore">0</span>
      </p>

      <button id="restartButton">
        RUN AGAIN
      </button>

    </div>

    <button id="mobileJump">
      JUMP
    </button>

  </div>


  <script>

    // ============================================================
    // CANVAS
    // ============================================================

    const canvas = document.getElementById("game");

    const ctx = canvas.getContext("2d");


    /*
      IMPORTANT:

      The game world is ALWAYS 1280 × 720.

      This gives us a consistent widescreen world regardless
      of the player's actual monitor or phone size.
    */

    const WORLD_WIDTH = 1280;
    const WORLD_HEIGHT = 720;

    canvas.width = WORLD_WIDTH;
    canvas.height = WORLD_HEIGHT;


    // ============================================================
    // UI
    // ============================================================

    const scoreDisplay =
      document.getElementById("score");

    const finalScoreDisplay =
      document.getElementById("finalScore");

    const gameOverScreen =
      document.getElementById("gameOver");

    const restartButton =
      document.getElementById("restartButton");

    const mobileJump =
      document.getElementById("mobileJump");


    // ============================================================
    // WORLD
    // ============================================================

    const groundY = 585;


    // ============================================================
    // PLAYER
    // ============================================================

    const player = {

      /*
        Smaller player relative to the world means we can see
        considerably more of the environment around them.
      */

      x: 180,

      y: groundY - 68,

      width: 46,

      height: 68,

      velocityY: 0,

      gravity: 0.75,

      jumpPower: -15.5,

      grounded: true,

      // Used for the running animation

      animationTimer: 0

    };


    // ============================================================
    // GAME VARIABLES
    // ============================================================

    let obstacles = [];

    let score = 0;

    let gameSpeed = 8;

    let gameRunning = true;

    let obstacleTimer = 0;

    /*
      Obstacles are now spawned WELL outside the visible
      right edge of the game.

      This creates a larger "world" ahead of the player.
    */

    let nextObstacle =
      170 + Math.random() * 120;


    // ============================================================
    // CLOUDS
    // ============================================================

    const clouds = [

      {
        x: 140,
        y: 120,
        scale: 1
      },

      {
        x: 470,
        y: 180,
        scale: 0.75
      },

      {
        x: 820,
        y: 100,
        scale: 1.2
      },

      {
        x: 1150,
        y: 155,
        scale: 0.8
      }

    ];


    // ============================================================
    // RESET GAME
    // ============================================================

    function resetGame() {

      player.x = 180;

      player.y =
        groundY - player.height;

      player.velocityY = 0;

      player.grounded = true;

      player.animationTimer = 0;


      obstacles = [];


      score = 0;


      /*
        Starting speed is slightly slower so the player has
        plenty of time to react to obstacles.
      */

      gameSpeed = 8;


      obstacleTimer = 0;


      /*
        Large initial gap before the first obstacle.
      */

      nextObstacle =
        180 + Math.random() * 120;


      gameRunning = true;


      scoreDisplay.textContent = "0";


      gameOverScreen.style.display =
        "none";

    }


    // ============================================================
    // JUMP
    // ============================================================

    function jump() {

      if (!gameRunning) {

        restartGame();

        return;

      }


      if (player.grounded) {

        player.velocityY =
          player.jumpPower;

        player.grounded = false;

      }

    }


    // ============================================================
    // KEYBOARD CONTROLS
    // ============================================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.code === "Space" ||
          event.code === "ArrowUp" ||
          event.code === "KeyW"
        ) {

          event.preventDefault();

          jump();

        }

      }
    );


    // ============================================================
    // MOUSE / TOUCH
    // ============================================================

    canvas.addEventListener(
      "pointerdown",
      function() {
        jump();
      }
    );


    mobileJump.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        jump();

      }
    );


    restartButton.addEventListener(
      "click",
      restartGame
    );


    // ============================================================
    // CREATE OBSTACLE
    // ============================================================

    function createObstacle() {

      /*
        Obstacles have different sizes so the game doesn't
        feel completely repetitive.
      */

      const obstacleHeight =
        45 + Math.random() * 55;

      const obstacleWidth =
        32 + Math.random() * 28;


      /*
        IMPORTANT:

        Instead of spawning directly at x = 1280,
        obstacles appear between 1450 and 1650.

        This gives the player a larger field of view and
        lets them see what's coming much earlier.
      */

      const spawnDistance =
        WORLD_WIDTH +
        170 +
        Math.random() * 180;


      obstacles.push({

        x: spawnDistance,

        y:
          groundY -
          obstacleHeight,

        width:
          obstacleWidth,

        height:
          obstacleHeight

      });

    }


    // ============================================================
    // COLLISION
    // ============================================================

    function collision(a, b) {

      /*
        Slightly shrink both hitboxes.

        This makes collisions feel fairer than using the
        exact visual rectangles.
      */

      const paddingX = 7;

      const paddingY = 5;


      return (

        a.x + paddingX <
          b.x + b.width - paddingX &&

        a.x + a.width - paddingX >
          b.x + paddingX &&

        a.y + paddingY <
          b.y + b.height - paddingY &&

        a.y + a.height - paddingY >
          b.y + paddingY

      );

    }


    // ============================================================
    // UPDATE
    // ============================================================

    function update() {

      if (!gameRunning) {
        return;
      }


      // ----------------------------------------------------------
      // PLAYER PHYSICS
      // ----------------------------------------------------------

      player.velocityY +=
        player.gravity;

      player.y +=
        player.velocityY;


      // ----------------------------------------------------------
      // GROUND
      // ----------------------------------------------------------

      if (
        player.y +
        player.height >=
        groundY
      ) {

        player.y =
          groundY -
          player.height;

        player.velocityY = 0;

        player.grounded = true;

      } else {

        player.grounded = false;

      }


      // ----------------------------------------------------------
      // RUNNING ANIMATION
      // ----------------------------------------------------------

      player.animationTimer +=
        0.18;


      // ----------------------------------------------------------
      // OBSTACLE SPAWNING
      // ----------------------------------------------------------

      obstacleTimer++;


      if (
        obstacleTimer >=
        nextObstacle
      ) {

        createObstacle();


        obstacleTimer = 0;


        /*
          Keep obstacle spacing generous.

          As the speed increases, the game becomes harder,
          but the player still gets warning time.
        */

        nextObstacle =
          110 +
          Math.random() * 150;

      }


      // ----------------------------------------------------------
      // MOVE OBSTACLES
      // ----------------------------------------------------------

      for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
      ) {

        const obstacle =
          obstacles[i];


        obstacle.x -=
          gameSpeed;


        // Collision

        if (
          collision(
            player,
            obstacle
          )
        ) {

          endGame();

        }


        // Remove once far offscreen

        if (
          obstacle.x +
          obstacle.width <
          -100
        ) {

          obstacles.splice(i, 1);

        }

      }


      // ----------------------------------------------------------
      // SCORE
      // ----------------------------------------------------------

      score += 0.1;


      scoreDisplay.textContent =
        Math.floor(score);


      // ----------------------------------------------------------
      // DIFFICULTY
      // ----------------------------------------------------------

      /*
        The game slowly gets faster.

        Maximum speed keeps it playable.
      */

      if (gameSpeed < 14) {

        gameSpeed += 0.0015;

      }

    }


    // ============================================================
    // DRAW
    // ============================================================

    function draw() {

      ctx.clearRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      // ==========================================================
      // SKY
      // ==========================================================

      const skyGradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          WORLD_HEIGHT
        );


      skyGradient.addColorStop(
        0,
        "#4db8ff"
      );


      skyGradient.addColorStop(
        1,
        "#e9f8ff"
      );


      ctx.fillStyle =
        skyGradient;


      ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      // ==========================================================
      // SUN
      // ==========================================================

      ctx.fillStyle =
        "rgba(255, 235, 130, 0.9)";


      ctx.beginPath();


      ctx.arc(
        1080,
        125,
        58,
        0,
        Math.PI * 2
      );


      ctx.fill();


      // ==========================================================
      // CLOUDS
      // ==========================================================

      clouds.forEach(
        cloud => {

          drawCloud(
            cloud.x,
            cloud.y,
            cloud.scale
          );

        }
      );


      // ==========================================================
      // DISTANT HILLS
      // ==========================================================

      drawHills();


      // ==========================================================
      // GROUND
      // ==========================================================

      ctx.fillStyle =
        "#67a94e";


      ctx.fillRect(
        0,
        groundY,
        WORLD_WIDTH,
        WORLD_HEIGHT -
        groundY
      );


      // ==========================================================
      // GROUND TOP
      // ==========================================================

      ctx.fillStyle =
        "#3e762e";


      ctx.fillRect(
        0,
        groundY,
        WORLD_WIDTH,
        10
      );


      // ==========================================================
      // GROUND DETAILS
      // ==========================================================

      drawGroundDetails();


      // ==========================================================
      // OBSTACLES
      // ==========================================================

      obstacles.forEach(
        obstacle => {

          drawObstacle(
            obstacle
          );

        }
      );


      // ==========================================================
      // PLAYER
      // ==========================================================

      drawPlayer();

    }


    // ============================================================
    // DRAW CLOUD
    // ============================================================

    function drawCloud(
      x,
      y,
      scale
    ) {

      ctx.fillStyle =
        "rgba(255,255,255,0.82)";


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        28 * scale,
        0,
        Math.PI * 2
      );


      ctx.arc(
        x + 35 * scale,
        y - 12 * scale,
        38 * scale,
        0,
        Math.PI * 2
      );


      ctx.arc(
        x + 72 * scale,
        y,
        28 * scale,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    // ============================================================
    // DRAW HILLS
    // ============================================================

    function drawHills() {

      ctx.fillStyle =
        "rgba(75, 150, 100, 0.35)";


      ctx.beginPath();


      ctx.moveTo(
        0,
        groundY
      );


      ctx.quadraticCurveTo(
        150,
        390,
        320,
        groundY
      );


      ctx.quadraticCurveTo(
        500,
        380,
        690,
        groundY
      );


      ctx.quadraticCurveTo(
        870,
        400,
        1040,
        groundY
      );


      ctx.quadraticCurveTo(
        1150,
        420,
        1280,
        groundY
      );


      ctx.lineTo(
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      ctx.lineTo(
        0,
        WORLD_HEIGHT
      );


      ctx.closePath();


      ctx.fill();

    }


    // ============================================================
    // GROUND DETAILS
    // ============================================================

    function drawGroundDetails() {

      /*
        Little lines moving underneath the player give the
        impression that the world is moving quickly.
      */

      const offset =
        (score * 8) % 100;


      ctx.fillStyle =
        "rgba(255,255,255,0.12)";


      for (
        let x = -100;
        x < WORLD_WIDTH + 100;
        x += 100
      ) {

        ctx.fillRect(
          x - offset,
          groundY + 48,
          45,
          5
        );

      }

    }


    // ============================================================
    // DRAW OBSTACLE
    // ============================================================

    function drawObstacle(
      obstacle
    ) {

      const x =
        obstacle.x;

      const y =
        obstacle.y;

      const w =
        obstacle.width;

      const h =
        obstacle.height;


      // Main body

      ctx.fillStyle =
        "#8b4513";


      ctx.fillRect(
        x,
        y,
        w,
        h
      );


      // Highlight

      ctx.fillStyle =
        "#a96327";


      ctx.fillRect(
        x + 5,
        y + 5,
        7,
        h - 10
      );


      // Top

      ctx.fillStyle =
        "#6f3510";


      ctx.fillRect(
        x - 4,
        y,
        w + 8,
        9
      );

    }


    // ============================================================
    // DRAW PLAYER
    // ============================================================

    function drawPlayer() {

      const x =
        player.x;

      const y =
        player.y;


      // Body

      ctx.fillStyle =
        "#20242b";


      ctx.fillRect(
        x,
        y,
        player.width,
        player.height
      );


      // Head highlight

      ctx.fillStyle =
        "#343a43";


      ctx.fillRect(
        x + 5,
        y + 5,
        player.width - 10,
        22
      );


      // Eye

      ctx.fillStyle =
        "white";


      ctx.fillRect(
        x + 30,
        y + 13,
        7,
        7
      );


      // Eye pupil

      ctx.fillStyle =
        "#111";


      ctx.fillRect(
        x + 33,
        y + 15,
        3,
        3
      );


      // ----------------------------------------------------------
      // RUNNING LEGS
      // ----------------------------------------------------------

      ctx.fillStyle =
        "#20242b";


      if (player.grounded) {

        const legAnimation =
          Math.sin(
            player.animationTimer
          ) * 6;


        ctx.fillRect(
          x + 5,
          y + player.height,
          12,
          13 + legAnimation
        );


        ctx.fillRect(
          x + 29,
          y + player.height,
          12,
          13 - legAnimation
        );

      } else {

        // Legs tucked slightly while jumping

        ctx.fillRect(
          x + 4,
          y + player.height - 2,
          14,
          10
        );


        ctx.fillRect(
          x + 28,
          y + player.height - 2,
          14,
          10
        );

      }

    }


    // ============================================================
    // GAME OVER
    // ============================================================

    function endGame() {

      gameRunning = false;


      finalScoreDisplay.textContent =
        Math.floor(score);


      gameOverScreen.style.display =
        "flex";

    }


    // ============================================================
    // RESTART
    // ============================================================

    function restartGame() {

      resetGame();


      requestAnimationFrame(
        gameLoop
      );

    }


    // ============================================================
    // GAME LOOP
    // ============================================================

    function gameLoop() {

      update();

      draw();


      if (gameRunning) {

        requestAnimationFrame(
          gameLoop
        );

      }

    }


    // ============================================================
    // START GAME
    // ============================================================

    resetGame();


    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
</html>
