<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iron Man Runner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a10;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       GAME WINDOW
    ========================= */

    #gameWrapper {
      position: relative;

      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);

      aspect-ratio: 16 / 9;

      overflow: hidden;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;
    }

    /* =========================
       SCORE
    ========================= */

    #ui {
      position: absolute;

      top: 22px;
      left: 28px;

      color: white;

      font-size: 27px;
      font-weight: 900;

      text-shadow:
        3px 3px 0 rgba(0, 0, 0, 0.4);

      pointer-events: none;
    }

    /* =========================
       GAME OVER
    ========================= */

    #gameOver {
      position: absolute;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      text-align: center;
    }

    #gameOver h1 {
      font-size: clamp(48px, 8vw, 105px);

      letter-spacing: 4px;

      margin-bottom: 10px;
    }

    #gameOver p {
      font-size: 24px;

      margin-bottom: 26px;
    }

    #restartButton {
      border: none;

      border-radius: 12px;

      padding: 15px 30px;

      background: white;

      color: #111;

      font-size: 19px;

      font-weight: 800;

      cursor: pointer;

      transition: transform 0.15s ease;
    }

    #restartButton:hover {
      transform: scale(1.05);
    }

    #restartButton:active {
      transform: scale(0.97);
    }

    /* =========================
       MOBILE JUMP BUTTON
    ========================= */

    #mobileJump {
      position: absolute;

      right: 24px;
      bottom: 24px;

      width: 84px;
      height: 84px;

      border-radius: 50%;

      border: 3px solid white;

      background: rgba(0, 0, 0, 0.35);

      color: white;

      font-size: 15px;

      font-weight: 900;

      z-index: 10;

      touch-action: manipulation;
    }

    #mobileJump:active {
      transform: scale(0.94);
    }

    @media (hover: hover) and (pointer: fine) {
      #mobileJump {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="gameWrapper">

    <canvas id="game"></canvas>

    <div id="ui">
      SCORE: <span id="score">0</span>
    </div>

    <div id="gameOver">

      <h1>GAME OVER</h1>

      <p>
        Score:
        <span id="finalScore">0</span>
      </p>

      <button id="restartButton">
        FLY AGAIN
      </button>

    </div>

    <button id="mobileJump">
      JUMP
    </button>

  </div>


  <script>

    // ============================================================
    // CANVAS
    // ============================================================

    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");


    // The game is always 1280 × 720.
    // This keeps the game widescreen.

    const WORLD_WIDTH = 1280;
    const WORLD_HEIGHT = 720;

    canvas.width = WORLD_WIDTH;
    canvas.height = WORLD_HEIGHT;


    // ============================================================
    // UI
    // ============================================================

    const scoreDisplay =
      document.getElementById("score");

    const finalScoreDisplay =
      document.getElementById("finalScore");

    const gameOverScreen =
      document.getElementById("gameOver");

    const restartButton =
      document.getElementById("restartButton");

    const mobileJump =
      document.getElementById("mobileJump");


    // ============================================================
    // IRON MAN IMAGE
    // ============================================================

    /*
      IMPORTANT:

      Keep iron-man.png in the SAME folder as index.html.

      GitHub should look like:

          index.html
          iron-man.png
    */

    const ironMan =
      new Image();

    ironMan.src =
      "iron-man.png";


    // ============================================================
    // WORLD
    // ============================================================

    const groundY = 585;


    // ============================================================
    // PLAYER
    // ============================================================

    const player = {

      // Position

      x: 155,

      y: groundY - 125,

      // Visual size

      width: 190,

      height: 100,

      // Collision box

      hitX: 165,

      hitY: groundY - 102,

      hitW: 170,

      hitH: 72,

      // Physics

      velocityY: 0,

      gravity: 0.72,

      jumpPower: -14.5,

      grounded: true,

      // Animation

      bob: 0
    };


    // ============================================================
    // GAME VARIABLES
    // ============================================================

    let obstacles = [];

    let score = 0;

    let gameSpeed = 8;

    let gameRunning = true;

    let obstacleTimer = 0;

    let nextObstacle =
      180 + Math.random() * 120;


    // ============================================================
    // CLOUDS
    // ============================================================

    const clouds = [

      {
        x: 130,
        y: 120,
        scale: 1
      },

      {
        x: 470,
        y: 175,
        scale: 0.75
      },

      {
        x: 820,
        y: 100,
        scale: 1.2
      },

      {
        x: 1140,
        y: 155,
        scale: 0.8
      }

    ];


    // ============================================================
    // RESET
    // ============================================================

    function resetGame() {

      player.y =
        groundY - 125;

      player.velocityY = 0;

      player.grounded = true;

      player.bob = 0;


      obstacles = [];


      score = 0;


      gameSpeed = 8;


      obstacleTimer = 0;


      nextObstacle =
        180 + Math.random() * 120;


      gameRunning = true;


      scoreDisplay.textContent =
        "0";


      gameOverScreen.style.display =
        "none";
    }


    // ============================================================
    // JUMP
    // ============================================================

    function jump() {

      if (!gameRunning) {

        restartGame();

        return;
      }


      if (player.grounded) {

        player.velocityY =
          player.jumpPower;

        player.grounded = false;
      }
    }


    // ============================================================
    // KEYBOARD CONTROLS
    // ============================================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.code === "Space" ||
          event.code === "ArrowUp" ||
          event.code === "KeyW"
        ) {

          event.preventDefault();

          jump();
        }

      }
    );


    // ============================================================
    // MOUSE / TOUCH CONTROLS
    // ============================================================

    canvas.addEventListener(
      "pointerdown",
      function() {

        jump();

      }
    );


    mobileJump.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        jump();

      }
    );


    restartButton.addEventListener(
      "click",
      restartGame
    );


    // ============================================================
    // CREATE OBSTACLE
    // ============================================================

    function createObstacle() {

      const obstacleHeight =
        45 + Math.random() * 55;

      const obstacleWidth =
        32 + Math.random() * 28;


      /*
        Obstacles spawn far beyond the visible area.

        This gives you plenty of warning.
      */

      const spawnDistance =
        WORLD_WIDTH +
        260 +
        Math.random() * 240;


      obstacles.push({

        x: spawnDistance,

        y:
          groundY -
          obstacleHeight,

        width:
          obstacleWidth,

        height:
          obstacleHeight

      });
    }


    // ============================================================
    // COLLISION
    // ============================================================

    function collision() {

      for (
        const obstacle of obstacles
      ) {

        const playerBox = {

          x: player.hitX,

          y: player.hitY,

          width: player.hitW,

          height: player.hitH

        };


        if (

          playerBox.x <
            obstacle.x +
            obstacle.width &&

          playerBox.x +
            playerBox.width >
            obstacle.x &&

          playerBox.y <
            obstacle.y +
            obstacle.height &&

          playerBox.y +
            playerBox.height >
            obstacle.y

        ) {

          return true;

        }

      }

      return false;
    }


    // ============================================================
    // UPDATE
    // ============================================================

    function update() {

      if (!gameRunning) {

        return;
      }


      // PLAYER PHYSICS

      player.velocityY +=
        player.gravity;

      player.y +=
        player.velocityY;


      // GROUND

      if (
        player.y +
        player.height >=
        groundY - 18
      ) {

        player.y =
          groundY -
          18 -
          player.height;

        player.velocityY = 0;

        player.grounded = true;

      } else {

        player.grounded = false;

      }


      // FLYING ANIMATION

      player.bob +=
        0.14;


      // OBSTACLE SPAWNING

      obstacleTimer++;


      if (
        obstacleTimer >=
        nextObstacle
      ) {

        createObstacle();


        obstacleTimer = 0;


        nextObstacle =
          110 +
          Math.random() * 150;

      }


      // MOVE OBSTACLES

      for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
      ) {

        const obstacle =
          obstacles[i];


        obstacle.x -=
          gameSpeed;


        // Collision

        if (collision()) {

          endGame();

        }


        // Delete old obstacles

        if (
          obstacle.x +
          obstacle.width <
          -100
        ) {

          obstacles.splice(i, 1);

        }

      }


      // SCORE

      score += 0.1;


      scoreDisplay.textContent =
        Math.floor(score);


      // GRADUALLY INCREASE SPEED

      if (gameSpeed < 14) {

        gameSpeed += 0.0015;

      }

    }


    // ============================================================
    // DRAW CLOUD
    // ============================================================

    function drawCloud(
      x,
      y,
      scale
    ) {

      ctx.fillStyle =
        "rgba(255,255,255,0.82)";


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        28 * scale,
        0,
        Math.PI * 2
      );


      ctx.arc(
        x + 35 * scale,
        y - 12 * scale,
        38 * scale,
        0,
        Math.PI * 2
      );


      ctx.arc(
        x + 72 * scale,
        y,
        28 * scale,
        0,
        Math.PI * 2
      );


      ctx.fill();
    }


    // ============================================================
    // DRAW HILLS
    // ============================================================

    function drawHills() {

      ctx.fillStyle =
        "rgba(75,150,100,0.35)";


      ctx.beginPath();


      ctx.moveTo(
        0,
        groundY
      );


      ctx.quadraticCurveTo(
        150,
        390,
        320,
        groundY
      );


      ctx.quadraticCurveTo(
        500,
        380,
        690,
        groundY
      );


      ctx.quadraticCurveTo(
        870,
        400,
        1040,
        groundY
      );


      ctx.quadraticCurveTo(
        1150,
        420,
        1280,
        groundY
      );


      ctx.lineTo(
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      ctx.lineTo(
        0,
        WORLD_HEIGHT
      );


      ctx.closePath();


      ctx.fill();
    }


    // ============================================================
    // DRAW GROUND
    // ============================================================

    function drawGround() {

      ctx.fillStyle =
        "#67a94e";


      ctx.fillRect(
        0,
        groundY,
        WORLD_WIDTH,
        WORLD_HEIGHT - groundY
      );


      ctx.fillStyle =
        "#3e762e";


      ctx.fillRect(
        0,
        groundY,
        WORLD_WIDTH,
        10
      );


      // Moving ground marks

      const offset =
        (score * 8) % 100;


      ctx.fillStyle =
        "rgba(255,255,255,0.12)";


      for (
        let x = -100;
        x < WORLD_WIDTH + 100;
        x += 100
      ) {

        ctx.fillRect(
          x - offset,
          groundY + 48,
          45,
          5
        );

      }

    }


    // ============================================================
    // DRAW OBSTACLE
    // ============================================================

    function drawObstacle(
      obstacle
    ) {

      const x =
        obstacle.x;

      const y =
        obstacle.y;

      const w =
        obstacle.width;

      const h =
        obstacle.height;


      // Main obstacle

      ctx.fillStyle =
        "#8b4513";


      ctx.fillRect(
        x,
        y,
        w,
        h
      );


      // Highlight

      ctx.fillStyle =
        "#a96327";


      ctx.fillRect(
        x + 5,
        y + 5,
        7,
        h - 10
      );


      // Top

      ctx.fillStyle =
        "#6f3510";


      ctx.fillRect(
        x - 4,
        y,
        w + 8,
        9
      );

    }


    // ============================================================
    // DRAW IRON MAN
    // ============================================================

    function drawPlayer() {

      /*
        Use the uploaded Iron Man image.

        The image needs to be called:

            iron-man.png

        and must be in the same folder as index.html.
      */

      if (
        ironMan.complete &&
        ironMan.naturalWidth
      ) {

        const bob =
          player.grounded
            ? Math.sin(player.bob) * 2
            : 0;


        ctx.save();


        // Small shadow to separate Iron Man from the background

        ctx.shadowColor =
          "rgba(0,0,0,0.25)";

        ctx.shadowBlur = 10;

        ctx.shadowOffsetY = 8;


        ctx.drawImage(

          ironMan,

          player.x - 20,

          player.y - 15 + bob,

          230,

          122

        );


        ctx.restore();

      } else {

        // Temporary fallback while image loads

        ctx.fillStyle =
          "#b51f25";


        ctx.fillRect(

          player.x,

          player.y,

          player.width,

          player.height

        );

      }

    }


    // ============================================================
    // DRAW EVERYTHING
    // ============================================================

    function draw() {

      ctx.clearRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      // SKY

      const sky =
        ctx.createLinearGradient(
          0,
          0,
          0,
          WORLD_HEIGHT
        );


      sky.addColorStop(
        0,
        "#4db8ff"
      );


      sky.addColorStop(
        1,
        "#e9f8ff"
      );


      ctx.fillStyle =
        sky;


      ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
      );


      // SUN

      ctx.fillStyle =
        "rgba(255,235,130,0.9)";


      ctx.beginPath();


      ctx.arc(
        1080,
        125,
        58,
        0,
        Math.PI * 2
      );


      ctx.fill();


      // CLOUDS

      clouds.forEach(
        cloud => {

          drawCloud(
            cloud.x,
            cloud.y,
            cloud.scale
          );

        }
      );


      // HILLS

      drawHills();


      // GROUND

      drawGround();


      // OBSTACLES

      obstacles.forEach(
        obstacle => {

          drawObstacle(
            obstacle
          );

        }
      );


      // IRON MAN

      drawPlayer();

    }


    // ============================================================
    // GAME OVER
    // ============================================================

    function endGame() {

      gameRunning = false;


      finalScoreDisplay.textContent =
        Math.floor(score);


      gameOverScreen.style.display =
        "flex";

    }


    // ============================================================
    // RESTART
    // ============================================================

    function restartGame() {

      resetGame();


      requestAnimationFrame(
        gameLoop
      );

    }


    // ============================================================
    // GAME LOOP
    // ============================================================

    function gameLoop() {

      update();

      draw();


      if (gameRunning) {

        requestAnimationFrame(
          gameLoop
        );

      }

    }


    // ============================================================
    // START
    // ============================================================

    resetGame();

    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
</html>
