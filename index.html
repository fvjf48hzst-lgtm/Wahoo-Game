<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUN!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#75c9ff, #dff6ff);
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      z-index: 10;
    }

    #gameOver {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      text-align: center;
      z-index: 20;
    }

    #gameOver h1 {
      font-size: clamp(50px, 10vw, 100px);
      margin-bottom: 15px;
    }

    #gameOver p {
      font-size: 22px;
      margin-bottom: 25px;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    #mobileJump {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid white;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 18px;
      font-weight: bold;
      z-index: 15;
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>

  <div id="ui">
    Score: <span id="score">0</span>
  </div>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">RUN AGAIN</button>
  </div>

  <button id="mobileJump">JUMP</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreDisplay = document.getElementById("score");
    const finalScoreDisplay = document.getElementById("finalScore");
    const gameOverScreen = document.getElementById("gameOver");

    let width;
    let height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();


    // =========================
    // PLAYER
    // =========================

    const player = {
      x: 120,
      y: 0,
      width: 45,
      height: 60,

      velocityY: 0,
      gravity: 0.8,
      jumpPower: -15,

      grounded: false
    };


    // =========================
    // GAME VARIABLES
    // =========================

    let groundY;

    let obstacles = [];

    let gameSpeed = 7;

    let score = 0;

    let gameRunning = true;

    let obstacleTimer = 0;

    let nextObstacle = 100;


    // =========================
    // RESET
    // =========================

    function resetGame() {

      groundY = height - 100;

      player.y = groundY - player.height;
      player.velocityY = 0;

      obstacles = [];

      gameSpeed = 7;

      score = 0;

      obstacleTimer = 0;
      nextObstacle = 100;

      gameRunning = true;

      scoreDisplay.textContent = "0";

      gameOverScreen.style.display = "none";
    }


    // =========================
    // JUMP
    // =========================

    function jump() {

      if (!gameRunning) {
        restartGame();
        return;
      }

      if (player.grounded) {
        player.velocityY = player.jumpPower;
        player.grounded = false;
      }
    }


    document.addEventListener("keydown", function(event) {

      if (
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.code === "KeyW"
      ) {
        event.preventDefault();
        jump();
      }

    });


    canvas.addEventListener("pointerdown", jump);

    document.getElementById("mobileJump")
      .addEventListener("pointerdown", function(event) {
        event.preventDefault();
        jump();
      });


    // =========================
    // OBSTACLES
    // =========================

    function createObstacle() {

      const obstacleHeight =
        35 + Math.random() * 45;

      const obstacleWidth =
        25 + Math.random() * 25;

      obstacles.push({
        x: width + 50,

        y: groundY - obstacleHeight,

        width: obstacleWidth,

        height: obstacleHeight
      });
    }


    // =========================
    // COLLISION
    // =========================

    function collision(a, b) {

      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }


    // =========================
    // UPDATE
    // =========================

    function update() {

      if (!gameRunning) return;


      // PLAYER PHYSICS

      player.velocityY += player.gravity;

      player.y += player.velocityY;


      // GROUND

      if (player.y + player.height >= groundY) {

        player.y = groundY - player.height;

        player.velocityY = 0;

        player.grounded = true;

      } else {

        player.grounded = false;

      }


      // OBSTACLE SPAWNING

      obstacleTimer++;

      if (obstacleTimer >= nextObstacle) {

        createObstacle();

        obstacleTimer = 0;

        nextObstacle =
          70 + Math.random() * 100;

      }


      // MOVE OBSTACLES

      for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        obstacle.x -= gameSpeed;


        // COLLISION

        if (collision(player, obstacle)) {

          endGame();

        }


        // REMOVE OFFSCREEN

        if (obstacle.x + obstacle.width < 0) {

          obstacles.splice(i, 1);

        }

      }


      // SCORE

      score += 0.1;

      scoreDisplay.textContent =
        Math.floor(score);


      // GRADUALLY SPEED UP

      gameSpeed += 0.001;

    }


    // =========================
    // DRAW
    // =========================

    function draw() {

      ctx.clearRect(0, 0, width, height);


      // SKY

      const skyGradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          height
        );

      skyGradient.addColorStop(0, "#63c7ff");
      skyGradient.addColorStop(1, "#e7f9ff");

      ctx.fillStyle = skyGradient;

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      // CLOUDS

      drawCloud(200, 120, 1);
      drawCloud(600, 180, 0.8);
      drawCloud(1000, 100, 1.2);


      // GROUND

      ctx.fillStyle = "#65a34b";

      ctx.fillRect(
        0,
        groundY,
        width,
        height - groundY
      );


      // GROUND LINE

      ctx.fillStyle = "#3f722e";

      ctx.fillRect(
        0,
        groundY,
        width,
        8
      );


      // PLAYER

      ctx.fillStyle = "#222";

      ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
      );


      // PLAYER FACE

      ctx.fillStyle = "white";

      ctx.fillRect(
        player.x + 27,
        player.y + 12,
        7,
        7
      );


      // PLAYER LEGS

      ctx.fillStyle = "#222";

      ctx.fillRect(
        player.x + 5,
        player.y + player.height,
        12,
        12
      );

      ctx.fillRect(
        player.x + 28,
        player.y + player.height,
        12,
        12
      );


      // OBSTACLES

      obstacles.forEach(obstacle => {

        ctx.fillStyle = "#8b4513";

        ctx.fillRect(
          obstacle.x,
          obstacle.y,
          obstacle.width,
          obstacle.height
        );

      });

    }


    // =========================
    // CLOUD
    // =========================

    function drawCloud(x, y, scale) {

      ctx.fillStyle =
        "rgba(255,255,255,0.8)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        25 * scale,
        0,
        Math.PI * 2
      );

      ctx.arc(
        x + 30 * scale,
        y - 10 * scale,
        35 * scale,
        0,
        Math.PI * 2
      );

      ctx.arc(
        x + 65 * scale,
        y,
        25 * scale,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }


    // =========================
    // GAME OVER
    // =========================

    function endGame() {

      gameRunning = false;

      finalScoreDisplay.textContent =
        Math.floor(score);

      gameOverScreen.style.display =
        "flex";
    }


    // =========================
    // RESTART
    // =========================

    function restartGame() {

      resetGame();

      requestAnimationFrame(gameLoop);
    }


    // =========================
    // GAME LOOP
    // =========================

    function gameLoop() {

      update();

      draw();

      if (gameRunning) {

        requestAnimationFrame(gameLoop);

      }

    }


    // START

    resetGame();

    requestAnimationFrame(gameLoop);

  </script>

</body>
</html>
